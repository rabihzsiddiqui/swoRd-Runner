  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(cx, cy, 9.2, 8.2, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = C.soft;
  ctx.beginPath(); ctx.ellipse(cx, cy, 8, 7, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#ffeedd";
  ctx.beginPath(); ctx.arc(cx + 3, cy - 1, 3.4, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#2a1a18";
  ctx.beginPath(); ctx.arc(cx + 4.2, cy - 1, 1.6, 0, 6.2832); ctx.fill();
}
// The default air-only pickup: a cluster of pulsing fireflies rather than a
// hung lantern, since the outdoor skins have nothing overhead to hang one
// from. Same box, same harmless/slashable rules - only the art changed.
// Sized up from the first pass, which read as barely a speck against sky.
function paintFirefly(o) {
  const bob = Math.sin(S.t * 2.4 + o.x * 0.08) * 2;
  const pulse = 0.65 + Math.sin(S.t * 4 + o.x * 0.05) * 0.35;
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2 + bob;
  ctx.globalAlpha = 0.28 * pulse;                         // halo
  ctx.fillStyle = C.blade;
  ctx.beginPath(); ctx.arc(cx, cy, 19, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.blade;                                // the lead firefly
  ctx.beginPath(); ctx.arc(cx, cy, 5.2 * pulse, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#fff7d6";
  ctx.beginPath(); ctx.arc(cx - 1.4, cy - 1.4, 2 * pulse, 0, 6.2832); ctx.fill();
  for (const s of [-1, 1]) {                              // two drifting companions
    const sx = cx + s * (11 + Math.sin(S.t * 1.6 + o.x * 0.1 + s) * 4);
    const sy = cy + Math.cos(S.t * 2.1 + o.x * 0.15 + s) * 8;
    const sp = 0.5 + Math.sin(S.t * 5 + o.x * 0.2 + s * 2) * 0.5;
    ctx.globalAlpha = 0.7 * sp;
    ctx.fillStyle = C.blade;
    ctx.beginPath(); ctx.arc(sx, sy, 2.3, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Gunmetal, closer to 9S's Pod than 2B's own - these are the anonymous
// Support Pods scattered through the level, not her personal one, so they
// deliberately read as a different, darker unit.
const POD = { body: "#2c2f34", hi: "#40444b" };
// 2B's own companion pod: light, matching her own white/silver palette
// instead of the level pickups, so the one that's actually hers never
// gets mistaken for one of them.
const POD_LIGHT = { body: "#e4e8ec", hi: "#ffffff" };

// A support Pod: a tall rectangular body on two thin bent arms, with the
// light mounted off-center on a stalk at the top corner rather than
// centered like an eye - that asymmetry plus the right-angled body is what
// reads as hardware instead of a creature. Shared by 2B's air-only pickup
// and her companion (see updateCompanion/render); only the palette differs.
function paintPod(o, palette) {
  const pal = palette || POD;
  const bob = Math.sin(S.t * 2.2 + o.x * 0.04) * 2;
  const pulse = 0.6 + Math.sin(S.t * 4 + o.x * 0.05) * 0.4;
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2 + bob;
  const bw = 11, bh = 20, bx = cx - bw / 2, by = cy - bh / 2 + 2;

  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;             // bent arms, drawn first
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + s * 3, by + bh - 1);
    ctx.lineTo(cx + s * 7, by + bh + 4);
    ctx.lineTo(cx + s * 9, by + bh + 9);
    ctx.stroke();
  }

  ctx.fillStyle = INK;                                    // tall rectangular body
  ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
  ctx.fillStyle = pal.body;
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = bw * 0.4;
  ctx.beginPath();                                        // panel shading, half the face
  ctx.moveTo(bx + bw * 0.75, by); ctx.lineTo(bx + bw * 0.75, by + bh);
  ctx.stroke();
  ctx.strokeStyle = pal.hi; ctx.lineWidth = 1.4;          // a lit edge for dimension
  ctx.beginPath();
  ctx.moveTo(bx + 1.4, by + 1); ctx.lineTo(bx + 1.4, by + bh - 1);
  ctx.stroke();

  const lx = bx + bw - 2, ly = by - 4;                    // light, off-center on a stalk
  ctx.strokeStyle = pal.body; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(lx, by); ctx.lineTo(lx, ly); ctx.stroke();
  ctx.globalAlpha = 0.28 * pulse;
  ctx.fillStyle = C.blade;
  ctx.beginPath(); ctx.arc(lx, ly, 7, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.blade;
  ctx.beginPath(); ctx.arc(lx, ly, 2.6 * pulse, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.stroke();
}

// Link's air-only pickup: a fairy carrying a little clay pot underneath
// her, glowing softly. Two pairs of wings (a big top pair, a small bottom
// pair) framing a bright orb, the pot hanging below like she's lugging it.
const FAIRY = { glow: "#eaf4ff", core: "#dcefff", wingLight: "#c7d3ef",
                wingDark: "#aab6da", pot: "#6b4423", potDark: "#4a2f18",
                potBand: "#f0ece1" };
function paintFairy(o) {
  const bob = Math.sin(S.t * 2.6 + o.x * 0.07) * 2.4;
  const pulse = 0.6 + Math.sin(S.t * 4 + o.x * 0.05) * 0.4;
  // Butterfly-style flutter: the wings' own width pulses shut and open on a
  // fast beat, independent of the slow float the rest of her does. abs(sin)
  // doubles the frequency so each half-cycle is its own stroke, up then
  // down, rather than one slow open-close per full period.
  const flapOpen = Math.abs(Math.sin(S.t * 16 + o.x * 0.2));
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2 + bob - 3;

  ctx.globalAlpha = 0.24 * pulse;                         // glow, behind everything
  ctx.fillStyle = FAIRY.glow;
  ctx.beginPath(); ctx.arc(cx, cy + 3, 16, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;

  const py = cy + 9;                                      // the pot, hanging below
  ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.ellipse(cx, py + 5, 4.4, 5, 0, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = FAIRY.pot; ctx.fill();
  ctx.fillStyle = FAIRY.potDark;
  ctx.beginPath(); ctx.ellipse(cx, py + 8, 4.2, 2.4, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = FAIRY.potBand; ctx.lineWidth = 1;     // a wavy band, not a plain ring
  ctx.beginPath();
  ctx.moveTo(cx - 3.4, py + 3.5); ctx.lineTo(cx - 1.2, py + 2.2);
  ctx.lineTo(cx + 1.2, py + 3.5); ctx.lineTo(cx + 3.4, py + 2.2);
  ctx.stroke();
  ctx.fillStyle = INK;                                    // dark mouth opening
  ctx.beginPath(); ctx.ellipse(cx, py, 3, 1.3, 0, 0, 6.2832); ctx.fill();

  ctx.strokeStyle = INK; ctx.lineWidth = 1;               // wings, behind the orb
  const wingW = 0.2 + 0.8 * flapOpen;                     // 20% (edge-on) to 100% (spread wide)
  for (const s of [-1, 1]) {
    ctx.fillStyle = FAIRY.wingLight;
    ctx.beginPath();
    ctx.ellipse(cx + s * 6, cy - 3, 5.4 * wingW, 3.6, s * 0.5, 0, 6.2832);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = FAIRY.wingDark;
    ctx.beginPath();
    ctx.ellipse(cx + s * 4.4, cy + 2.2, 3.2 * wingW, 2.2, s * 0.4, 0, 6.2832);
    ctx.fill(); ctx.stroke();
  }

  ctx.fillStyle = INK;                                    // the fairy herself: one orb
  ctx.beginPath(); ctx.arc(cx, cy, 4.6, 0, 6.2832); ctx.fill();
  ctx.fillStyle = FAIRY.core;
  ctx.beginPath(); ctx.arc(cx, cy, 3.8, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = pulse;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(cx - 1.2, cy - 1.2, 1.4, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
}

const PAINTERS = { barrier: paintBarrier, brute: paintBrute,
                   flyer: paintFlyer, lantern: paintFirefly };

/* ============================================================
   ENEMY SETS — a skin can swap the look of any enemy without touching its box.
   Hitboxes, spawn rules and slashability all stay in CONFIG and OB.
   ============================================================ */

// Machine lifeform palette. Light grey so it reads as metal, and light enough to
// stay clear of the dark barrier the player has to jump.
const MACH = { body: "#c5cbd1", head: "#d2d7dc", eye: "#f2867a" };

// Two small lit eyes. The light red sits close to the grey in luminance, so it is
// the ink ring that makes them read. That ring is also the floor on how small
// these can go: below about 2 units the outline swallows the fill entirely.
function machineEyes(cx, cy, spread) {
  for (const dx of [-spread, spread]) {
    ctx.beginPath(); ctx.arc(cx + dx, cy, 2.0, 0, 6.2832);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.0; ctx.stroke();
    ctx.fillStyle = MACH.eye; ctx.fill();
  }
}

function machineRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// The flyer: a machine that hovers on a slab. No wings, so it only drifts.
function paintMachineFlyer(o) {
  const bob = Math.sin(S.t * 2.0 + o.x * 0.04) * 1.7;
  const top = o.y + bob;
  ctx.lineJoin = "round";

  machineRoundRect(o.x + 7, top + 2, 18, 17, 7);      // body behind the head
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = MACH.body; ctx.fill();

  const hx = o.x + 11.5, hy = top + 9.5;              // head
  ctx.beginPath(); ctx.arc(hx, hy, 7.5, 0, 6.2832);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = MACH.head; ctx.fill();
  machineEyes(hx, hy + 1.0, 3.0);

  machineRoundRect(o.x + 1, top + 17, 28, 8, 3);      // hover slab
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = MACH.body; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = "rgba(24,28,34,0.18)";
  ctx.fillRect(o.x + 1, top + 21, 28, 4);
  ctx.restore();
}

// 2B's ground enemy: a machine lifeform. Circular head with two lit eyes, and a
// capsule body with a flat bottom. Kept light grey against the dark angular
// barrier, and the eyes stay red, because red is the game's "this one can be cut"
// signal and a grey blob would read as armour.
function paintMachineBrute(o) {
  const bob = Math.sin(S.t * 7 + o.x * 0.05) * 1.0;
  const L = o.x + 4, R = o.x + o.w - 2, B = o.y + o.h;
  const cx = (L + R) / 2, r = (R - L) / 2, T = o.y + o.h - 13 + bob;

  ctx.beginPath();                                    // capsule, flat bottom
  ctx.moveTo(L, B);
  ctx.lineTo(L, T);
  ctx.arc(cx, T, r, Math.PI, 0);
  ctx.lineTo(R, B);
  ctx.closePath();
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
  ctx.fillStyle = MACH.body; ctx.fill();
  ctx.save();                                         // shaded underside
  ctx.clip();
  ctx.fillStyle = "rgba(24,28,34,0.20)";
  ctx.fillRect(L, B - 8, R - L, 8);
  ctx.restore();

  const hx = o.x + 10, hy = o.y + 8.5 + bob;          // head
  ctx.beginPath(); ctx.arc(hx, hy, 8, 0, 6.2832);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = MACH.head; ctx.fill();

  machineEyes(hx, hy + 1.2, 3.2);
}

// Link's flyer: a Keese. One glowing eye with a vertical slit pupil dead
// center of the face is the whole identity here, so unlike every other
// enemy in the game it does not get a two-eyed face at all.
const KEESE = { body: "#332a3d", wing: "#241d2c", eye: "#ffd94a" };
function paintKeese(o) {
  const flap = Math.sin(S.t * 15 + o.x * 0.1);
  const bob = Math.sin(S.t * 5 + o.x * 0.03) * 1.5;
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2 + bob;

  ctx.fillStyle = KEESE.wing;                             // membranous, scalloped
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.lineJoin = "round";
  for (const dir of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + dir * 2, cy - 2);
    ctx.quadraticCurveTo(cx + dir * 10, cy - 10 - flap * 6, cx + dir * 16, cy - 3 - flap * 4);
    ctx.quadraticCurveTo(cx + dir * 11, cy + 2 - flap, cx + dir * 9, cy + 6 - flap * 2);
    ctx.quadraticCurveTo(cx + dir * 5, cy + 2, cx + dir * 2, cy + 3);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  ctx.fillStyle = INK;                                    // outline ring
  ctx.beginPath(); ctx.ellipse(cx, cy, 8.2, 7.2, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = KEESE.body;
  ctx.beginPath(); ctx.ellipse(cx, cy, 7, 6, 0, 0, 6.2832); ctx.fill();

  ctx.fillStyle = KEESE.body;                             // ears
  for (const dir of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + dir * 3, cy - 5);
    ctx.lineTo(cx + dir * 5.5, cy - 11);
    ctx.lineTo(cx + dir * 1.5, cy - 6);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = KEESE.eye;                              // one eye, not two
  ctx.beginPath(); ctx.arc(cx, cy - 0.5, 3.2, 0, 6.2832); ctx.fill();
  ctx.fillStyle = INK;                                    // vertical slit pupil
  ctx.beginPath(); ctx.ellipse(cx, cy - 0.5, 0.9, 2.6, 0, 0, 6.2832); ctx.fill();
}

const ENEMY_SETS = {
  machine: { brute: paintMachineBrute, flyer: paintMachineFlyer, lantern: paintPod },
  keese: { flyer: paintKeese, lantern: paintFairy }
};
function painterFor(type) {
  const set = ENEMY_SETS[SK().enemySet];
  return (set && set[type]) || PAINTERS[type];
}


/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const W = CONFIG.width, H = CONFIG.height, G = CONFIG.groundY;

  const grad = ctx.createLinearGradient(0, 0, 0, G);
  grad.addColorStop(0, BG.sky0); grad.addColorStop(1, BG.sky1);

  // Shake shifts everything drawn below by a few px, which would otherwise
  // uncover a sliver of unpainted buffer at whichever edge it pulls away
  // from. This base fill covers that sliver, so it has to match the real
  // scene at each edge: the same sky gradient above the ground line, grass
  // below it, not one flat colour for the whole buffer.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, G);
  ctx.fillStyle = BG.ground;
  ctx.fillRect(0, G, W, H - G);

  // shake in whole buffer pixels, so it never blurs the grid.
  // note: no ctx.clip() here on purpose. clip() intersects rather than
  // replaces, so re-clipping every frame slowly shrank the visible area.
  const sx = Math.round((Math.random() - 0.5) * S.shake);
  const sy = Math.round((Math.random() - 0.5) * S.shake);
  ctx.setTransform(1, 0, 0, 1, sx, sy);

  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, G);

  // parallax silhouettes, back to front: mountains, rolling hills, treeline
  // blocks, individual trees (or, for a "buildings" skin, a tilted ruined
  // skyline standing in for the first two). Each layer scrolls at its own
  // fraction of S.distance (closer layers move faster) and every shape is
  // placed purely as a function of its own index, so nothing jitters
  // between frames.
  // Faded a step below full opacity and desaturated in BG, so the whole set
  // recedes behind the fully-opaque foreground instead of competing with it
  // for attention (the trees especially: a single vivid circle for a canopy
  // read too much like a slashable enemy from a distance).
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = BG.far;
  for (let i = 0; i < 7; i++) {
    const x = wrap(i * 190 - S.distance * 0.18, W + 340) - 170;
    if (BG.style === "buildings") {
      const w = 55 + (i % 3) * 18, h = 130 + (i % 4) * 34;
      const tilt = i % 5 === 2 ? 0.05 : i % 5 === 4 ? -0.045 : 0;
      // pivoting a tilted building around a point ON the ground line swings
      // one bottom corner up above it, opening a gap the ground fill can't
      // cover. Extending the rect a few px past the pivot keeps the whole
      // base submerged no matter which way it leans.
      ctx.save();
      ctx.translate(x + w / 2, G);
      ctx.rotate(tilt);
      ctx.fillRect(-w / 2, -h, w, h + 8);
      ctx.restore();
    } else {
      const w = 150;
      ctx.beginPath();
      ctx.moveTo(x, G); ctx.lineTo(x + w / 2, G - 92 - (i % 3) * 26); ctx.lineTo(x + w, G);
      ctx.fill();
    }
  }
  ctx.fillStyle = BG.mid;
  for (let i = 0; i < 6; i++) {
    const x = wrap(i * 220 - S.distance * 0.28, W + 400) - 200;
    if (BG.style === "buildings") {
      const w = 42 + (i % 3) * 16, h = 54 + (i % 3) * 20;
      const tilt = i % 4 === 1 ? -0.05 : i % 4 === 3 ? 0.04 : 0;
      ctx.save();
      ctx.translate(x + w / 2, G);
      ctx.rotate(tilt);
      ctx.fillRect(-w / 2, -h, w, h + 8);
      ctx.restore();
    } else {
      const w = 200, bump = 30 + (i % 3) * 15;
      ctx.beginPath();
      ctx.moveTo(x, G);
      ctx.quadraticCurveTo(x + w / 2, G - bump * 2, x + w, G);
      ctx.fill();
    }
  }
  // Buildings, not floating boxes: height varies but the base is always
  // planted a few px into the grass, never above the ground line, and they
  // stay fully opaque even while the rest of the background is faded -
  // unlike a hazy mountain or a tree, a building isn't see-through.
  ctx.globalAlpha = 1;
  ctx.fillStyle = BG.near;
  for (let i = 0; i < 9; i++) {
    const x = wrap(i * 130 - S.distance * 0.42, W + 260) - 130;
    const h = 30 + (i % 4) * 9;
    ctx.fillRect(x, G + 6 - h, 74, h);
  }
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = BG.tree;
  for (let i = 0; i < 12; i++) {
    const x = wrap(i * 97 - S.distance * 0.5, W + 220) - 110;
    const trunk = 12 + (i % 3) * 5, r = 7 + (i % 4) * 2;
    const cy = G - trunk;
    ctx.fillRect(x - 2, cy, 4, trunk);
    // three overlapping lobes, not one clean circle: a lone round canopy
    // was too easy to mistake for a round, slashable enemy at a glance
    ctx.beginPath(); ctx.arc(x, cy - r * 0.3, r, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(x - r * 0.8, cy + r * 0.25, r * 0.72, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.8, cy + r * 0.25, r * 0.72, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = BG.ground; ctx.fillRect(0, G, W, H - G);
  ctx.strokeStyle = BG.line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, G + 1); ctx.lineTo(W, G + 1); ctx.stroke();
  ctx.strokeStyle = BG.turf;
  for (let i = 0; i < 22; i++) {
    const x = wrap(i * 44 - S.distance, W + 88) - 44;
    ctx.beginPath(); ctx.moveTo(x, G + 16); ctx.lineTo(x + 22, G + 16); ctx.stroke();
  }

  // Nature reclaiming the ruins: sparse clumps of a brighter green sitting
  // right on the ground line, skipping most indices so they read as patches
  // in certain spots rather than a continuous strip. Only skins that set a
  // growth color get these; the default grass ground has no need for them.
  if (BG.growth) {
    ctx.fillStyle = BG.growth;
    for (let i = 0; i < 16; i++) {
      if (i % 5 === 0 || i % 5 === 3) continue;    // irregular gaps between clumps
      const x = wrap(i * 51 + 26 - S.distance, W + 102) - 51;
      const r = 5 + (i % 4) * 2, gy = G - 1;
      ctx.beginPath(); ctx.arc(x, gy, r, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(x - r * 0.9, gy + 2, r * 0.6, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.9, gy + 2, r * 0.6, 0, 6.2832); ctx.fill();
    }
  }

  for (const o of S.obstacles) {
    if (SPRITES[o.type]) ctx.drawImage(SPRITES[o.type], o.x, o.y, o.w, o.h);
    else painterFor(o.type)(o);
  }

  // beams, drawn behind the character so she stays the clearest thing on screen
  for (const b of S.beams) {
    const fade = 1 - b.age / CONFIG.beam.life;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const sw = sword();
    ctx.save();
    ctx.globalAlpha = Math.max(0, fade);
    ctx.strokeStyle = "rgba(" + sw.trail + ",0.22)";
    ctx.lineWidth = b.w + 12; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, b.y + 3);
    ctx.quadraticCurveTo(cx + 13, cy, cx, b.y + b.h - 3);
    ctx.stroke();
    ctx.strokeStyle = sw.blade; ctx.lineWidth = b.w * 0.42;
    ctx.beginPath();
    ctx.moveTo(cx, b.y + 3);
    ctx.quadraticCurveTo(cx + 13, cy, cx, b.y + b.h - 3);
    ctx.stroke();
    ctx.strokeStyle = sw.edge; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(cx + 2, b.y + 6);
    ctx.quadraticCurveTo(cx + 14, cy, cx + 2, b.y + b.h - 6);
    ctx.stroke();
    ctx.restore();
  }

  if (S.dropped) {
    const k = S.dropped;
    drawSword({ x: k.x, y: k.y }, k.ang, k.len, sword());
  }

  // player. if a sprite sheet is ever loaded it overrides the rig entirely.
  const p = S.player;
  const attacking = p.atkT >= 0;
  const key = attacking && SPRITES.playerAttack ? "playerAttack" : "player";
  if (SPRITES[key]) {
    const fr = CONFIG.frame;
    ctx.drawImage(SPRITES[key], CONFIG.player.x - fr.ax, p.y - fr.ay, fr.w, fr.h);
  } else {
    // the sweep trail goes behind her, the rig draws the blade itself
    if (attacking) {
      const a = CONFIG.attack, pv = slashPivot();
      if (p.atkT >= a.windup && p.atkT < a.windup + a.active) {
        const u = (p.atkT - a.windup) / a.active;
        ctx.strokeStyle = "rgba(" + sword().trail + ",0.30)";
        ctx.lineWidth = sword().glow ? 12 : 9; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(pv.x, pv.y, pv.r, pv.a0, pv.a0 + (pv.a1 - pv.a0) * u);
        ctx.stroke();
      }
    }
    drawCharacter();
  }

  // her companion, drawn independently of the rig/sprite branch above so it
  // shows the same whichever one is active. Reuses paintPod exactly - same
  // shape code as the airborne pickup, just following her instead of
  // sitting still.
  if (SK().companion === "pod" && S.companion) {
    const c = S.companion;
    paintPod({ x: c.x - 11, y: c.y - 11, w: 22, h: 22 }, POD_LIGHT);
  }

  for (const pt of S.particles) {
    ctx.globalAlpha = Math.max(0, 1 - pt.age / pt.life);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
  }
  ctx.globalAlpha = 1;

  ctx.setTransform(1, 0, 0, 1, 0, 0);   // HUD never shakes
  drawHud();

  // Outside the fixed 800x360 buffer the device rarely shares its aspect
  // ratio (portrait phones especially), so the letterbox bars extend the
  // sky and the grass to the real screen edges instead of showing a flat,
  // mismatched color. The split sits at the actual ground line, so it stays
  // seamless with the buffer drawn on top of it.
  const groundScreenY = view.oy + CONFIG.groundY * view.scale;
  const skyGrad = dctx.createLinearGradient(0, view.oy, 0, groundScreenY);
  skyGrad.addColorStop(0, BG.sky0);
  skyGrad.addColorStop(1, BG.sky1);
  dctx.fillStyle = skyGrad;
  dctx.fillRect(0, 0, canvas.width, groundScreenY);
  dctx.fillStyle = BG.ground;
  dctx.fillRect(0, groundScreenY, canvas.width, canvas.height - groundScreenY);

  // drawImage's destination size must land on whole device pixels. CONFIG.width
  // * view.scale is usually fractional, and a fractional edge gets antialiased
  // against whatever's beneath it (the extension fill), which shows up as a
  // faint seam right at the old 800x360 boundary. Rounding it removes the
  // fractional edge, and the letterbox math below reuses the same rounded
  // size so the two stay pixel-aligned.
  const bw = Math.round(CONFIG.width * view.scale);
  const bh = Math.round(CONFIG.height * view.scale);
  dctx.drawImage(buffer, view.ox, view.oy, bw, bh);

  // The ready/paused/dead screens dim the whole buffer; letterboxTint carries
  // that same darkness (set in drawHud/panel) onto the letterbox bars, so the
  // dimmed backdrop reaches the true screen edges instead of stopping at the
  // old 800x360 boundary.
  if (letterboxTint > 0) {
    dctx.fillStyle = "rgba(14,17,22," + letterboxTint + ")";
    if (view.oy > 0) dctx.fillRect(0, 0, canvas.width, view.oy);
    if (view.oy + bh < canvas.height) dctx.fillRect(0, view.oy + bh, canvas.width, canvas.height - (view.oy + bh));
    if (view.ox > 0) dctx.fillRect(0, view.oy, view.ox, bh);
    if (view.ox + bw < canvas.width) dctx.fillRect(view.ox + bw, view.oy, canvas.width - (view.ox + bw), bh);
  }
}

// a small katana badge that mirrors the equipped blade, so the HUD and the
// weapon in her hand can never disagree
function drawSwordBadge(x, y) {
  const sw = sword();
  const a = -0.62, fx = Math.cos(a), fy = Math.sin(a);
  const nx = -Math.sin(a), ny = Math.cos(a);
  const len = 17 + S.swordLvl * 5;
  ctx.lineCap = "round";
  ctx.strokeStyle = sw.wrap; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + fx * 6, y + fy * 6); ctx.stroke();

  const b = { x: x + fx * 9, y: y + fy * 9 };
  const t = { x: x + fx * len, y: y + fy * len };

  if (SK().swordStyle === "straight") {
    // crossguard across the blade, not a katana's oval tsuba
    ctx.strokeStyle = sw.hilt; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x + fx * 7.5 - nx * 4.2, y + fy * 7.5 - ny * 4.2);
    ctx.lineTo(x + fx * 7.5 + nx * 4.2, y + fy * 7.5 + ny * 4.2);
    ctx.stroke();
    if (sw.gem) {
      ctx.fillStyle = sw.gem;
      ctx.beginPath();
      ctx.arc(x + fx * 7.8, y + fy * 7.8, 1.5, 0, 6.2832);
      ctx.fill();
    }
    const straight = w => {
      ctx.beginPath();
      ctx.moveTo(b.x - nx * w, b.y - ny * w);
      ctx.lineTo(b.x + fx * (len - 12) - nx * w, b.y + fy * (len - 12) - ny * w);
      ctx.lineTo(t.x, t.y);
      ctx.lineTo(b.x + fx * (len - 12) + nx * w, b.y + fy * (len - 12) + ny * w);
      ctx.lineTo(b.x + nx * w, b.y + ny * w);
      ctx.closePath();
      ctx.fill();
    };
    if (sw.glow) { ctx.fillStyle = "rgba(" + sw.trail + ",0.30)"; straight(4.2); }
    ctx.fillStyle = sw.blade; straight(1.9);
    ctx.strokeStyle = sw.edge; ctx.lineWidth = 0.8;   // fuller
    ctx.beginPath();
    ctx.moveTo(b.x + fx * 1.5, b.y + fy * 1.5);
    ctx.lineTo(b.x + fx * (len - 12), b.y + fy * (len - 12));
    ctx.stroke();
  } else {
    ctx.fillStyle = sw.hilt;
    ctx.beginPath();
    ctx.ellipse(x + fx * 7, y + fy * 7, 1.3, 3.4, a, 0, 6.2832); ctx.fill();
    const c = { x: (b.x + t.x) / 2 - nx * len * 0.11, y: (b.y + t.y) / 2 - ny * len * 0.11 };
    if (sw.glow) {
      ctx.strokeStyle = "rgba(" + sw.trail + ",0.30)"; ctx.lineWidth = 6.5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(c.x, c.y, t.x, t.y); ctx.stroke();
    }
    ctx.strokeStyle = sw.blade; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(c.x, c.y, t.x, t.y); ctx.stroke();
    // the icon is shown edge-up, so the edge line goes on the convex side too
    ctx.strokeStyle = sw.edge; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(b.x - nx * 1, b.y - ny * 1);
    ctx.quadraticCurveTo(c.x - nx * 1, c.y - ny * 1, t.x, t.y);
    ctx.stroke();
  }

  ctx.textAlign = "left";
  ctx.fillStyle = sw.glow ? sw.blade : C.text;
  ctx.font = "700 12px ui-monospace, monospace";
  ctx.fillText("Lvl " + sw.lvl, x + 26, y - 3);

  // progress pips toward the next level, hidden once fully upgraded
  if (S.swordLvl < CONFIG.swords.length - 1) {
    for (let i = 0; i < sword().toNext; i++) {
      ctx.beginPath();
      ctx.arc(x + 29 + i * 7, y + 5, 2.4, 0, 6.2832);
      ctx.fillStyle = i < S.lanterns ? C.blade : "rgba(124,135,152,0.45)";
      ctx.fill();
    }
  } else {
    ctx.fillStyle = C.dim;
    ctx.font = "600 8px ui-monospace, monospace";
    ctx.fillText("AWAKENED", x + 26, y + 8);
  }

  // beam cooldown, directly under the level. only exists once the blade is true.
  if (sw.beam) {
    const bw = 62, bh = 5, bx = x - 2, by = y + 16;
    const ready = S.beamCd <= 0;
    const fill = ready ? 1 : 1 - S.beamCd / CONFIG.beam.cooldown;
    ctx.fillStyle = "rgba(11,20,14,0.45)";
    ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    if (ready) {
      const pulse = 0.5 + 0.5 * Math.sin(S.t * 7.5);
      ctx.globalAlpha = 0.35 + 0.4 * pulse;          // breathes in step with the blade
      ctx.fillStyle = sw.blade;
      ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = ready ? sw.edge : sw.blade;
    ctx.fillRect(bx, by, bw * fill, bh);
    ctx.fillStyle = ready ? sw.blade : C.dim;
    ctx.font = "600 8px ui-monospace, monospace";
    ctx.fillText(ready ? "BEAM READY" : "CHARGING", bx, by + 15);
  }
}

// The attack button's icon, for skins that carry one (see .touch-btn CSS -
// currently just Link). Drawn on its own small canvas with its own context
// rather than reusing drawSwordBadge, which is wired to the shared game
// buffer's ctx and HUD layout; this only needs the blade itself, scaled up
// to fill a button instead of sitting beside a level number.
const attackIconCanvas = document.getElementById("attackIcon");
const attackIconCtx = attackIconCanvas.getContext("2d");
attackIconCtx.imageSmoothingEnabled = false;
let lastIconKey = "";
function updateTouchAttackIcon() {
  const skin = SK();
  if (skin.id !== "link") return;                    // only Link carries one, for now
  const key = skin.id + "," + S.swordLvl;
  if (key === lastIconKey) return;                    // redraw only when it can have changed
  lastIconKey = key;

  const sw = sword();
  const w = attackIconCanvas.width, h = attackIconCanvas.height;
  const ictx = attackIconCtx;
  ictx.clearRect(0, 0, w, h);
  ictx.lineCap = "round"; ictx.lineJoin = "round";

  const a = -0.7, fx = Math.cos(a), fy = Math.sin(a);
  const nx = -Math.sin(a), ny = Math.cos(a);
  const cx = w * 0.40, cy = h * 0.66, len = Math.min(w, h) * 0.62;

  ictx.strokeStyle = sw.wrap; ictx.lineWidth = w * 0.09;    // grip
  ictx.beginPath();
  ictx.moveTo(cx - fx * len * 0.22, cy - fy * len * 0.22);
  ictx.lineTo(cx, cy);
  ictx.stroke();

  ictx.strokeStyle = sw.hilt; ictx.lineWidth = w * 0.07;    // crossguard
  ictx.beginPath();
  ictx.moveTo(cx + fx * 2 - nx * len * 0.17, cy + fy * 2 - ny * len * 0.17);
  ictx.lineTo(cx + fx * 2 + nx * len * 0.17, cy + fy * 2 + ny * len * 0.17);
  ictx.stroke();
  if (sw.gem) {
    ictx.fillStyle = sw.gem;
    ictx.beginPath(); ictx.arc(cx + fx * 2.4, cy + fy * 2.4, w * 0.035, 0, 6.2832); ictx.fill();
  }

  const base = { x: cx + fx * 4, y: cy + fy * 4 };
  const shoulder = len * 0.72;
  const tip = { x: cx + fx * len, y: cy + fy * len };
  const hw = w * 0.052;
  const blade = (bw, style) => {
    ictx.beginPath();
    ictx.moveTo(base.x - nx * bw, base.y - ny * bw);
    ictx.lineTo(base.x + fx * shoulder - nx * bw, base.y + fy * shoulder - ny * bw);
    ictx.lineTo(tip.x, tip.y);
    ictx.lineTo(base.x + fx * shoulder + nx * bw, base.y + fy * shoulder + ny * bw);
    ictx.lineTo(base.x + nx * bw, base.y + ny * bw);
    ictx.closePath();
    ictx.fillStyle = style; ictx.fill();
  };
  if (sw.glow) blade(hw * 2.3, "rgba(" + sw.trail + ",0.35)");
  blade(hw * 1.4, INK);
  blade(hw, sw.blade);
  ictx.strokeStyle = sw.edge; ictx.lineWidth = Math.max(1, w * 0.018);
  ictx.beginPath();
  ictx.moveTo(base.x + fx * 2, base.y + fy * 2);
  ictx.lineTo(base.x + fx * shoulder, base.y + fy * shoulder);
  ictx.stroke();
}

// context and colour are parameters so the touch-control mute icon (drawn
// on its own small canvas, in a colour that has to match whichever skin's
// button it sits on) can reuse the exact same shape as the desktop HUD's.
function drawSpeaker(c, x, y, on, color) {
  c.fillStyle = color;
  c.beginPath();                                   // cone
  c.moveTo(x - 6, y - 2.5); c.lineTo(x - 3, y - 2.5); c.lineTo(x, y - 6);
  c.lineTo(x, y + 6); c.lineTo(x - 3, y + 2.5); c.lineTo(x - 6, y + 2.5);
  c.closePath(); c.fill();
  c.strokeStyle = color; c.lineWidth = 1.4; c.lineCap = "round";
  if (on) {
    for (const r of [3.5, 6]) {
      c.beginPath(); c.arc(x + 1, y, r, -0.85, 0.85); c.stroke();
    }
  } else {
    c.beginPath();
    c.moveTo(x + 3, y - 4); c.lineTo(x + 9, y + 4);
    c.moveTo(x + 9, y - 4); c.lineTo(x + 3, y + 4);
    c.stroke();
  }
}

// The touch-control mute button's icon. 2B's khaki buttons need a dark
// glyph instead of the usual light one (and a white one once pressed, to
// match how selecting an item in her menus works), so this redraws
// whenever the mute state, the skin, or the pressed state changes.
const muteIconCanvas = document.getElementById("muteIcon");
const muteIconCtx = muteIconCanvas.getContext("2d");
muteIconCtx.imageSmoothingEnabled = false;
let lastMuteIconKey = "";
function updateTouchMuteIcon() {
  const on = !MUSIC.muted && !musicMissing();
  const btnMute = document.getElementById("btnMute");
  const pressed = !!(btnMute && btnMute.classList.contains("pressed"));
  const key = SK().id + "," + on + "," + pressed;
  if (key === lastMuteIconKey) return;
  lastMuteIconKey = key;
  const w = muteIconCanvas.width, h = muteIconCanvas.height;
  muteIconCtx.setTransform(1, 0, 0, 1, 0, 0);
  muteIconCtx.clearRect(0, 0, w, h);
  const color = SK().id === "2b" ? (pressed ? "#f2ede0" : "#2c2a1d") : "#f4f8fb";
  const s = w / 24;                                 // drawSpeaker was authored around a 24px box
  muteIconCtx.setTransform(s, 0, 0, s, w / 2 - s, h / 2);   // scale up, recenter
  drawSpeaker(muteIconCtx, 0, 0, on, color);
  muteIconCtx.setTransform(1, 0, 0, 1, 0, 0);
}

// How dark the ready/paused/dead backdrop is this frame, 0..1. Set here and
// in panel(), then read by render() to extend the same tint onto the
// letterbox bars outside the buffer.
let letterboxTint = 0;

function drawHud() {
  const W = CONFIG.width, H = CONFIG.height;
  UI.buttons.length = 0;
  letterboxTint = 0;
  ctx.textAlign = "left";
  ctx.fillStyle = C.text;
  ctx.font = "700 26px ui-monospace, monospace";
  ctx.fillText(String(Math.floor(S.score)).padStart(5, "0"), 18, 38);

  ctx.font = "600 11px ui-monospace, monospace";
  ctx.fillStyle = C.dim;
  ctx.fillText("BEST " + String(S.best).padStart(5, "0"), 18, 56);

  drawSwordBadge(20, 78);

  if (S.levelFlash > 0) {
    const sw = sword();
    const k = Math.min(1, S.levelFlash / 1.6);
    ctx.globalAlpha = Math.min(1, k * 1.8);
    ctx.textAlign = "center";
    ctx.fillStyle = sw.blade;
    ctx.font = "700 22px ui-monospace, monospace";
    ctx.fillText(sw.name, W / 2, 120);
    ctx.fillStyle = C.dim;
    ctx.font = "600 11px ui-monospace, monospace";
    ctx.fillText("LONGER REACH", W / 2, 138);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  if (S.mult > 1) {
    ctx.textAlign = "right";
    ctx.fillStyle = C.blade;
    ctx.font = "700 24px ui-monospace, monospace";
    // sits below the pause button, which occupies y 16..40 on the right
    ctx.fillText("x" + S.mult, W - 18, 66);
    ctx.fillStyle = C.dim;
    ctx.font = "600 10px ui-monospace, monospace";
    ctx.fillText("KEEP SLASHING", W - 18, 82);
    ctx.textAlign = "left";
  }

  if (S.phase === "ready") {
    letterboxTint = 0.72;
    ctx.fillStyle = "rgba(14,17,22,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = C.text;
    ctx.font = "700 30px ui-monospace, monospace";
    ctx.fillText("SWORD RUNNER", W / 2, 52);
    ctx.fillStyle = C.dim;
    ctx.font = "600 12px ui-monospace, monospace";
    ctx.fillText("Left side or X to slash.  Right side or Space to jump.", W / 2, 76);
    ctx.fillText("Grey is armoured, so jump it. Red can be cut, and cutting builds your multiplier.", W / 2, 94);
    ctx.fillText("Gold lanterns hang at jump height. Cut them mid-air to awaken your blade.", W / 2, 112);
    ctx.fillStyle = C.text;
    ctx.font = "700 12px ui-monospace, monospace";
    ctx.fillText("CHOOSE A CHARACTER", W / 2, 146);
    ctx.textAlign = "left";
    skinPicker(158);
    ctx.textAlign = "center";
    ctx.fillStyle = C.blade;
    ctx.font = "700 13px ui-monospace, monospace";
    ctx.fillText("Tap anywhere else to start", W / 2, 232);
    ctx.textAlign = "left";
  }

  // speaker + pause: the canvas top-right icons on desktop, or the
  // dedicated .touch-center buttons on touch devices - never both.
  if (!IS_TOUCH) {
    button(W - 80, 16, 28, 24, "", () => { musicArm(); musicToggleMute(); }, { size: 12 });
    drawSpeaker(ctx, W - 80 + 14, 28, !MUSIC.muted && !musicMissing(), C.text);
    if (musicMissing()) {
      ctx.textAlign = "right";
      ctx.fillStyle = C.dim;
      ctx.font = "600 8px ui-monospace, monospace";
      ctx.fillText("no music file", W - 88, 31);
      ctx.textAlign = "left";
    }
    if (S.phase === "play" && !paused) {
      button(W - 44, 16, 28, 24, "II", togglePause, { size: 13 });
    }
  }

  if (paused) {
    letterboxTint = 0.78;
    ctx.fillStyle = "rgba(14,17,22,0.78)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = C.text;
    ctx.font = "700 30px ui-monospace, monospace";
    ctx.fillText("PAUSED", W / 2, 58);
    ctx.fillStyle = C.dim;
    ctx.font = "600 11px ui-monospace, monospace";
    ctx.fillText("Score " + Math.floor(S.score) + "    Best " + S.best, W / 2, 78);
    ctx.textAlign = "left";
    button(W / 2 - 150, 96, 140, 34, "RESUME", startCountdown);
    button(W / 2 + 10, 96, 140, 34, "RESTART", restartNow);
    ctx.textAlign = "center";
    ctx.fillStyle = C.text;
    ctx.font = "700 12px ui-monospace, monospace";
    ctx.fillText("CHARACTER", W / 2, 156);
    ctx.textAlign = "left";
    skinPicker(168);
    button(W / 2 - 70, 224, 140, 30, rumbleEnabled ? "RUMBLE: ON" : "RUMBLE: OFF",
      toggleRumble, { on: rumbleEnabled, size: 11 });
  }

  if (resumeIn > 0 && S.phase === "play") {
    const n = Math.ceil(resumeIn);
    const frac = 1 - (Math.ceil(resumeIn) - resumeIn);   // 1 -> 0 across each second
    ctx.textAlign = "center";
    ctx.globalAlpha = 0.30 + 0.45 * frac;
    ctx.fillStyle = C.text;
    ctx.font = "700 " + (54 + 22 * frac) + "px ui-monospace, monospace";
    ctx.fillText(String(n), W / 2, H / 2 + 6);
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.text;
    ctx.font = "700 13px ui-monospace, monospace";
    ctx.fillText("GET READY", W / 2, H / 2 + 34);
    ctx.textAlign = "left";
  }

  if (S.phase === "dead") panel([
    ["RUN ENDED", 30, C.text],
    ["Score " + Math.floor(S.score) + "    Best " + S.best, 15, C.dim],
    [S.deadTimer >= CONFIG.restartLock ? "Tap or press R to run again" : " ", 13, C.blade]
  ], (S.deadTimer - 0.75) / 0.5);
}

function panel(lines, fade) {
  const W = CONFIG.width, H = CONFIG.height;
  const a = fade === undefined ? 1 : Math.max(0, Math.min(1, fade));
  letterboxTint = 0.72 * a;
  if (a <= 0) return;
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(14,17,22,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  let y = H / 2 - (lines.length - 1) * 15 - 8;
  for (const [text, size, color] of lines) {
    ctx.fillStyle = color;
    ctx.font = (size > 20 ? "700 " : "600 ") + size + "px ui-monospace, monospace";
    ctx.fillText(text, W / 2, y);
    y += size > 20 ? 34 : 24;
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

/* ============================================================
   LOOP — fixed timestep so 60Hz and 120Hz devices play identically
   ============================================================ */
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;            // tab was backgrounded
  if (paused) acc = 0;
  else if (resumeIn > 0) { resumeIn = Math.max(0, resumeIn - dt); acc = 0; }
  else acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 240) { update(STEP); acc -= STEP; }
  musicUpdate(dt);
  render();
  updateTouchAttackIcon();
  updateTouchMuteIcon();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
